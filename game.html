<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tebak Gambar Puzzle</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="<KEY>" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Audio elements for game sounds -->
    <audio id="gameStartSound">
        <source src="assets/audio/game_start.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <audio id="correctAnswerSound">
        <source src="assets/audio/correct_answer.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <audio id="wrongAnswerSound">
        <source src="assets/audio/wrong_answer.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <audio id="puzzleSolvedSound">
        <source src="assets/audio/puzzle_solved.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <audio id="endgamedSound">
        <source src="assets/audio/end_gamed.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
</head>
<body class="bg-container">

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="customToast" class="toast text-white" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="3000">
            <div class="toast-body" id="toastBody"></div>
        </div>
    </div>
<div class="container">
    <div class="text">
        <h1>Tebak Gambar</h1>
    </div>
    <div class="row row-cols-1 g-4 justify-content-center">
        <div class="col-6">
            <div id="cardGameImage" class="card h-100">
                <div id="puzzle-board" class="card-img-top"></div>
<!--                <img id="puzzle-board" src="assets/img/error_not_found.jpg" class="card-img-top" alt="Tebak gambar"/>-->
                <div class="card-body">
                    <div class="row my-1">
                        <input type="text" id="userAnswer" placeholder="Masukkan jawaban..."/>
                    </div>
                    <div class="row my-1">
                        <button id="submitAnswer" class="btn">Jawaban</button>
                    </div>
                    <div class="row my-1">
                        <button id="backToHome" class="btn">Kembali ke Home</button>
                    </div>
                    <div class="score-display">
                        <p>Score: <span id="score" >0</span></p>
                    </div>
                </div>      
            </div>
        </div>
    </div>

</div>
<div id="modal" class="modal">
    <div class="modal-content">
        <p id="modalMessage"></p>
        <button id="modalOkButton" class="ok-button">OK</button>
    </div>
</div>
    <script src="assets/js/script.js"></script>
</body>
</html>
