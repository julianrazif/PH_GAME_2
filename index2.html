<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Singa 2x3</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f4f4;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .puzzle-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 2px;
      width: 384px;
      height: 256px;
      border: 4px solid #333;
      /*background-image: url('assets/img/hewan/singa/singa.jpg');*/
      /*background-size: cover;*/
      /*background-position: center;*/
      /*opacity: 0.8;*/
    }

    .puzzle-piece {
  position: absolute;
  width: 100px;
  height: 100px;
  background-image: url("img/hewan/singa/singa.jpg"); /* Gambar utuh */
  background-position: -100px -100px; /* Atur potongan ke posisi tertentu */
  -webkit-mask-image: url("../img/hewan/singa/piece_0_0.png"); /* bentuk puzzle */
  mask-image: url("../PH_GAME_2/assets/img/hewan/singa/piece_0_0.png");
  mask-size: cover;
}

    .controls {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 8px 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #45a049;
    }

    .info-panel {
      display: flex;
      justify-content: space-between;
      width: 384px;
      margin-top: 10px;
    }

    .message {
      margin-top: 10px;
      font-weight: bold;
      height: 20px;
    }
  </style>
</head>
<body>
<div class="game-container">
  <div class="puzzle-container" id="puzzle" style="top: 0; left: 0;">
    <div class="puzzle-container">
      <div class="puzzle-piece" data-row="0" data-col="0"></div>
      <div class="puzzle-piece" data-row="0" data-col="1"></div>
      <div class="puzzle-piece" data-row="0" data-col="2"></div>
      <div class="puzzle-piece" data-row="1" data-col="0"></div>
      <div class="puzzle-piece" data-row="1" data-col="1"></div>
      <div class="puzzle-piece" data-row="1" data-col="2"></div>
    </div>
    <!-- Potongan gambar akan dimuat lewat JS -->
  </div>
  <div class="puzzle-piece" draggable="true"></div>

  <div class="controls">
    <button id="reset-btn">Reset Puzzle</button>
    <button id="check-btn">Check Solution</button>
  </div>

  <div class="info-panel">
    <div>Time: <span id="timer">00:00</span></div>
    <div>Moves: <span id="moves">0</span></div>
  </div>

  <div class="message" id="message"></div>
</div>

<script>
  // DOM Elements
  const container = document.getElementById("puzzle");
  const resetBtn = document.getElementById("reset-btn");
  const checkBtn = document.getElementById("check-btn");
  const timerElement = document.getElementById("timer");
  const movesElement = document.getElementById("moves");
  const messageElement = document.getElementById("message");

  // Game variables
  const rows = 2;
  const cols = 3;
  let moves = 0;
  let timerInterval;
  let startTime;
  let dragged;
  let isGameStarted = false;

  // Create original pieces array with correct positions
  const originalPieces = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      originalPieces.push({
        row: r, 
        col: c, 
        src: `assets/img/hewan/singa/piece_${r}_${c}.png`,
        correctIndex: r * cols + c
      });
    }
  }

  const pieces = document.querySelectorAll('.puzzle-piece');

pieces.forEach(piece => {
  const row = piece.dataset.row;
  const col = piece.dataset.col;

  // Mask dan background berdasarkan posisi
  piece.style.maskImage = `url("img/hewan/singa/piece_${row}_${col}.png")`;
  piece.style.webkitMaskImage = `url("img/hewan/singa/piece_${row}_${col}.png")`;
  piece.style.backgroundImage = 'url("img/hewan/singa/singa.jpg")';
  piece.style.backgroundPosition = `-${col * 100}px -${row * 100}px`;
});

  // Initialize the game
  function initGame() {
    // Clear the container
    container.innerHTML = '';

    // Reset game variables
    moves = 0;
    movesElement.textContent = moves;
    messageElement.textContent = '';

    // Stop timer if running
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    timerElement.textContent = '00:00';

    // Shuffle pieces
    const shuffled = [...originalPieces].sort(() => Math.random() - 0.5);

    // Create and append puzzle pieces
    shuffled.forEach((piece, index) => {
      const img = document.createElement("img");
      img.src = piece.src;
      img.className = "puzzle-piece";
      img.draggable = true;
      img.dataset.index = index;
      img.dataset.correctIndex = piece.correctIndex;
      container.appendChild(img);
    });

    // Add event listeners to pieces
    setupDragAndDrop();

    isGameStarted = false;
  }

  // Set up drag and drop functionality
  function setupDragAndDrop() {
    document.querySelectorAll(".puzzle-piece").forEach(piece => {
      piece.addEventListener("dragstart", (e) => {
        dragged = e.target;

        // Start the timer on first move if not already started
        if (!isGameStarted) {
          startTimer();
          isGameStarted = true;
        }
      });

      piece.addEventListener("dragover", (e) => {
        e.preventDefault();
      });

      piece.addEventListener("drop", (e) => {
        e.preventDefault();
        if (dragged && dragged !== e.target) {
          // Swap src and correctIndex
          const tempSrc = dragged.src;
          const tempCorrectIndex = dragged.dataset.correctIndex;

          dragged.src = e.target.src;
          dragged.dataset.correctIndex = e.target.dataset.correctIndex;

          e.target.src = tempSrc;
          e.target.dataset.correctIndex = tempCorrectIndex;

          moves++;
          movesElement.textContent = moves;
        }
      });
    });
  }

  // Timer
  function startTimer() {
    startTime = new Date();
    timerInterval = setInterval(() => {
      const elapsed = Math.floor((new Date() - startTime) / 1000);
      const minutes = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const seconds = String(elapsed % 60).padStart(2, '0');
      timerElement.textContent = `${minutes}:${seconds}`;
    }, 1000);
  }

  // Check if puzzle is solved
  function checkSolution() {
    const currentPieces = document.querySelectorAll(".puzzle-piece");
    const isCorrect = Array.from(currentPieces).every((piece, index) => {
      return parseInt(piece.dataset.correctIndex) === index;
    });

    if (isCorrect) {
      messageElement.textContent = "Selamat! Puzzle berhasil diselesaikan 🎉";
      clearInterval(timerInterval);
    } else {
      messageElement.textContent = "Belum benar, coba lagi!";
    }
  }

  // Event listeners
  resetBtn.addEventListener("click", initGame);
  checkBtn.addEventListener("click", checkSolution);

  // Mulai permainan
  initGame();
</script>
</body>
</html>
